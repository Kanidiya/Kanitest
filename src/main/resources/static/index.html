<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Kanitest</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0078d4, #5c2d91);
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.12);
      padding: 3rem 4rem;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    p  { font-size: 1.1rem; opacity: 0.9; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: #fff;
      color: #0078d4;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Welcome to Kanitest</h1>
    <p>My first custom Spring Boot app on Azure App Service.</p>
    <span class="badge">Java 17 SE · India South Central</span>
  </div>
</body>
</html>
